name: Merge Store Repositories

on:
  workflow_dispatch:

jobs:
  merge_repos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Main Repo (aura-omni-store)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configure Git Credentials
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Force Keep Omni Priority for direct-shop
        run: |
          git remote add direct-shop https://${{ secrets.GITHUB_TOKEN }}@github.com/auravibepro-creator/aura-direct-shop.git
          git fetch direct-shop
          # ہم دوسری ریپوزٹری کی برانچ کو عارضی طور پر الگ فولڈر میں نکالتے ہیں
          git checkout -b temp-direct direct-shop/main || git checkout -b temp-direct direct-shop/master || true
          # واپس اپنی مین برانچ پر آتے ہیں
          git checkout main || git checkout master || true
          # صرف وہی فائلیں کاپی ہوں گی جو اومنی میں نہیں ہیں، ٹکرانے والی فائلیں اومنی کی ہی رہیں گی
          rsync -av --ignore-existing temp-direct/ ./ || true
          git branch -D temp-direct || true

      - name: Force Keep Omni Priority for source-sync-build
        run: |
          git remote add sync-build https://${{ secrets.GITHUB_TOKEN }}@github.com/auravibepro-creator/source-sync-build.git
          git fetch sync-build
          git checkout -b temp-sync sync-build/main || git checkout -b temp-sync sync-build/master || true
          git checkout main || git checkout master || true
          rsync -av --ignore-existing temp-sync/ ./ || true
          git branch -D temp-sync || true

      - name: Push Clean Code to Main Repo
        run: |
          git add -A
          git commit -m "Auto-synced with strict omni store priority" || true
          git push origin main --force || git push origin master --force
