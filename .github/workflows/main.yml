name: Merge Store Repositories

on:
  workflow_dispatch:

jobs:
    merge_repos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Main Repo (aura-omni-store)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configure Git Credentials
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Pull and Merge aura-direct-shop
        run: |
          git remote add direct-shop https://${{ secrets.GITHUB_TOKEN }}@github.com/auravibepro-creator/aura-direct-shop.git
          git fetch direct-shop
          git merge direct-shop/main --allow-unrelated-histories -X ours --no-commit || true
          git checkout --ours . || true
          git add -A
          git commit -m "Merge direct-shop with Omni priority" || true

      - name: Pull and Merge source-sync-build
        run: |
          git remote add source-sync-build https://${{ secrets.GITHUB_TOKEN }}@github.com/auravibepro-creator/source-sync-build.git
          git fetch source-sync-build
          git merge source-sync-build/master --allow-unrelated-histories -X ours --no-commit || true
          git checkout --ours . || true
          git add -A
          git commit -m "Merge source-sync-build with Omni priority" || true

      - name: Push Merged Code to Main Repo
        run: |
          git push origin main --force
